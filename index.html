<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zarra Defenders 2D</title>
  <!-- F3.5: aggressive no-cache headers so the browser doesn't serve stale
       modules after we bump the ?v=N query strings on each commit. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="styles/main.css?v=44">
  <!-- Favicon inline vacío para evitar 404 sin agregar archivo binario -->
  <link rel="icon" href="data:,">
</head>
<body>
  <!-- Modal de aviso para rotar el móvil si está en portrait -->
  <div id="orientation-warning" class="hidden" aria-hidden="true">
    <div class="rotate-icon" aria-hidden="true">
      <!-- Icono SVG inline: móvil con flecha de rotación -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
        <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <!-- Silueta de móvil en portrait -->
          <rect x="35" y="15" width="30" height="60" rx="4"/>
          <circle cx="50" cy="68" r="2"/>
          <!-- Flecha de rotación -->
          <path d="M 75 50 Q 85 30 75 15" />
          <polyline points="80,15 75,15 75,20"/>
        </g>
      </svg>
    </div>
    <p data-i18n="orientation.rotarMovil">Por favor, gira el móvil para jugar</p>
  </div>

  <!-- Contenedor principal del juego con ratio 16:9 bloqueado -->
  <div id="game-container">
    <!-- World canvas: mundo iso + tiles + sprites de enemigos. z-index 1. -->
    <div id="game-canvas-wrapper"></div>
    <!-- HUD canvas: mano, corazones, papeleta. Encima del mundo. z-index 2. -->
    <div id="game-hud-wrapper"></div>
    <!-- F3: integrity HUD (top-right 3 segments) — z-index 50 -->
    <div id="integrity-hud" class="hidden"></div>
    <!-- F3: main menu (first-paint, 3 buttons + Acerca de/Disclaimer modals) — z-index 100 -->
    <div id="main-menu" class="hidden"></div>
    <!-- F3: game-over + victory overlay — z-index 200 -->
    <div id="game-overlay" class="hidden"></div>
    <!-- F1.1: pedagogy card overlay — z-index 150 -->
    <div id="pedagogy-card" class="hidden pedagogy-card" role="dialog" aria-live="polite" aria-labelledby="pedagogy-card-title"></div>
    <!-- F1.2: modal intermedio cada 5 enemigos — z-index 140 -->
    <div id="modal-intermedio" class="hidden modal-intermedio" aria-hidden="true"></div>
    <!-- F1.3: resumen final navegable — z-index 250 (encima de game-overlay) -->
    <div id="resumen-final" class="hidden resumen-final" aria-hidden="true"></div>
    <!-- F1.4: biblioteca pedagógica — z-index 260 -->
    <div id="biblioteca" class="hidden biblioteca" aria-hidden="true"></div>
    <!-- F1.5: data screen pre-nivel — z-index 270 (encima de biblioteca) -->
    <div id="data-screen" class="hidden data-screen" aria-hidden="true"></div>
    <!-- Modal de disclaimer (placeholder; se implementa en Fase 7) -->
    <div id="disclaimer-modal" class="hidden"></div>
  </div>

  <!-- Botones de utilidad en los márgenes del letterbox/pillarbox -->
  <button id="fullscreen-btn" class="hidden" type="button" aria-label="Pantalla completa" data-i18n-aria="fullscreen.ariaLabel">
    <!-- Icono SVG inline: 4 esquinas + flechas hacia afuera -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4,8 4,4 8,4"/>
        <polyline points="20,8 20,4 16,4"/>
        <polyline points="4,16 4,20 8,20"/>
        <polyline points="20,16 20,20 16,20"/>
      </g>
    </svg>
  </button>

  <!-- Pixi.js v7 estable (cargado desde CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.0/dist/pixi.min.js"></script>
  <!-- Bootstrap i18n: aplica STRINGS al DOM estático antes del main. -->
  <script type="module" src="src/ui/i18n-bootstrap.js?v=44"></script>
  <!-- Nuestro código (ES modules, sin build step) — query string para forzar no-cache durante dev -->
  <script type="module" src="src/main.js?v=44"></script>
</body>
</html>
